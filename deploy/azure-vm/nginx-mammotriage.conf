# One origin for the app and the server: https://__DOMAIN__/ serves the app, /mcp and /health go to the server.
# Listens on loopback only; cloudflared brings the traffic in (no public ports on the VM).
server {
    listen 127.0.0.1:8080;
    server_name __DOMAIN__;

    root /var/www/mammotriage;
    index index.html;
    server_tokens off;

    # base64 images: up to 10 MB of image (MAMMO_MAX_IMAGE_MB) grow by 4/3, plus the JSON-RPC envelope.
    client_max_body_size 15m;

    # Security headers on every response, the server's included. A location with its own add_header would drop
    # them (nginx does not inherit add_header), so locations set caching with `expires` instead.
    # frame-ancestors only works as a header (it is ignored in the app's <meta> CSP): no framing of a camera app.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location = /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Streamable HTTP answers can be event streams: no buffering, room for a slow analysis.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # Usage report for the pilot administrator (the server checks the Access e-mail).
    location = /usage {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # The service worker and the HTML must never be served stale (Cache-Control: no-cache); hashed assets can be
    # cached for a year.
    location = /sw.js {
        expires -1;
    }
    location /assets/ {
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
