# Tests, architecture contracts and a dependency audit on every pull request and on main.
# The model weights are private, so integration tests (marker "integration") are not run here.
# Changes that only touch documentation skip the tests; "CI result" always reports, so it is the one check that the
# branch protection of main requires (a required check that never runs would block the pull request).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Documentation only: Markdown files, docs/, LICENSE and NOTICE. Anything else, or a diff that cannot be
        # computed (first push of a branch), counts as code.
        run: |
          if files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) \
             && ! grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)' <<< "$files"; then
            echo "Documentation only:"; echo "$files"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum supported; 3.12 is what the production VM (Ubuntu 24.04) runs.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # onnxruntime only for the ONNX bundle checks; the rest of the ONNX extra (OCR) is not needed by unit tests.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]" onnxruntime
      - name: Tests
        run: pytest -q
      - name: Architecture contracts (onion layers)
        run: lint-imports

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit installed dependencies
        run: |
          python -m pip install --upgrade pip setuptools pip-audit
          pip install -e ".[onnx]"
          pip-audit --skip-editable

  result:
    name: CI result
    if: always()
    needs: [changes, test, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped") and .changes.result == "success"' <<< "$NEEDS"
